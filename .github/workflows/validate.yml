name: Validate format catalogue
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5'
      - name: Validate catalogue
        run: python scripts/validate.py
      - name: Run negative validation tests
        run: python scripts/test_validation.py
